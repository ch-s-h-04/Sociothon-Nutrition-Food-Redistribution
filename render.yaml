services:
  - type: web
    name: sociothon-nutrition-food-redistribution
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VITE_CARTO_API_KEY
        sync: false
